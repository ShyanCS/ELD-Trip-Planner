[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eld-trip-planner"
version = "1.0.1"
description = "FMCSA hours-of-service compliance engine and trip planning API"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ShyanCS" }]
keywords = ["fmcsa", "eld", "hos", "hours-of-service", "django", "trip-planner"]
classifiers = [
    "Framework :: Django",
    "Programming Language :: Python :: 3.11",
]
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["trip", "config"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W = pycodestyle, F = Pyflakes, I = isort
select = ["E", "W", "F", "I"]
ignore = [
    "E501",   # line-too-long — handled by formatter, not lint
]

[tool.ruff.lint.isort]
known-first-party = ["trip", "config"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
