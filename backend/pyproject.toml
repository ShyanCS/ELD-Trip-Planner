[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W = pycodestyle, F = Pyflakes, I = isort
select = ["E", "W", "F", "I"]
ignore = [
    "E501",   # line-too-long — handled by formatter, not lint
]

[tool.ruff.lint.isort]
known-first-party = ["trip", "config"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
