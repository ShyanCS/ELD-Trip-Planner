[project]
name = "eld-trip-planner-backend"
version = "1.0.1"
description = "FMCSA Hours-of-Service compliant ELD trip planner — Django REST backend"
requires-python = ">=3.10"
dependencies = [
    "Django>=5.2.17,<6.0",
    "djangorestframework>=3.15,<4.0",
    "django-cors-headers>=4.3,<5.0",
    "requests>=2.33.0,<3.0",
    "python-decouple>=3.8,<4.0",
    "gunicorn>=22.0.0,<23.0",
    "whitenoise>=6.7,<7.0",
    "python-json-logger>=2.0,<5.0",
    "sentry-sdk>=2.14.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["trip/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W = pycodestyle, F = Pyflakes, I = isort
select = ["E", "W", "F", "I"]
ignore = [
    "E501",   # line-too-long — handled by formatter, not lint
]

[tool.ruff.lint.isort]
known-first-party = ["trip", "config"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
